<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabs com API</title>
    <link rel="stylesheet" href="index.css">

</head>

<body>

    <div class="tabs">
        <button class="tab-btn active" onclick="abrirTab(0)">IMC</button>
        <button class="tab-btn" onclick="abrirTab(1)">Média</button>
    </div>

    <a id="logout" class="logout-link" onclick="logout()">Logout</a>

    <div class="tab-content active">
        <h2>Cadastro cliente</h2>

        <input type="text" id="nome" placeholder="Nome">
        <input type="number" id="cpf" placeholder="CPF">
        <input type="number" id="cep" placeholder="CEP" onblur="buscarEndereco()">
        <input type="text" id="rua" placeholder="Rua">
        <input type="text" id="cidade" placeholder="Cidade">
        <input type="text" id="estado" placeholder="Estado">
        <input type="number" id="numero" placeholder="Número">
     



        <button onclick="cadastrarClientes()">Cadastrar</button>

        <div class="resultado" id="resultadoCliente"></div>
    </div>

    <div class="tab-content">
        <h2>Calcular Média</h2>

        <input type="number" id="nota1" placeholder="Nota 1">
        <input type="number" id="nota2" placeholder="Nota 2">

        <button onclick="calcularMedia()">Calcular Média</button>

        <div class="resultado" id="resultadoMedia"></div>
    </div>

    <script src="index.js"></script>
</body>

</html>
