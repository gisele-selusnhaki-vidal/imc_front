    <style>
        body{
            font-family: arial ,sans-serif;
            max-width: 700px;
            margin: 40px auto;
            background: #f4f4f4;
        }
        .tabs{
            display: flex;
            margin-bottom: 10px;
        }
        .tab-btn{
            flex:1;
            padding: 15px;
            cursor: pointer;
            border: none;
            background: #ddd;
            font-size: 16;
        }
        .tab-btn.active{
            background: #007bff;
            color: white;
        }
        .tab-content{
            display: none;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        .tab-content.active{
            display: block;
        }
        input{
            width: 100%;
            padding: 10px;
            margin: 8px 0;

        }
        button{
            padding: 12px;

        }
    </style>
</head>

        function abrirTab(index){
            document.querySelectorALL('.tab-content').forEach(tab=> tab.classList,remove('active'));
            document.querySelectorALL('.tab-btn').forEach(btn=> btn.classList,remove('active'));

</html>
